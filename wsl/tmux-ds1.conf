# Tema DS1 pro tmux: barra estilo HUD do Dark Souls (preto com dourado) e painéis transparentes (aparece o fundo de
# pedra do perfil "Claude DS1" do Windows Terminal). O instalador põe "source-file ~/.config/thema-ds1/tmux-ds1.conf"
# no fim do ~/.tmux.conf.
# --- Visual: HUD do Dark Souls (preto com dourado; direita = ~/bin/tmux_hud) ---
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=#c8b890"
set -g status-left-length 30
set -g status-left "#[bg=#3a2810,fg=#f0c460,bold] ✦ #S #[bg=#0e0a08,fg=#3a2810]▌#[default] "
set -g status-right-length 45
set -g status-right "#(~/bin/tmux_hud)#[fg=#5a4a30]│#[fg=#c8b890] %H:%M "
setw -g window-status-format "#[fg=#8a7a5a] #I #W "
setw -g window-status-current-format "#[bg=#c8a04a,fg=#140e06,bold] ▸ #I #W#{?window_zoomed_flag, (zoom),} "
setw -g window-status-separator ""
set -g pane-border-style "fg=#4a3a20"
set -g pane-active-border-style "fg=#c8a04a"
set -g message-style "bg=#1a120a,fg=#f0c460"
set -g mode-style "bg=#4a3a20,fg=#f6e8cc"

# fundo dos painéis transparente: aparece a pedra do menu da fogueira (fundo do perfil "Claude DS1" no Windows Terminal).
set -g window-style "bg=default,fg=default"
set -g window-active-style "bg=default,fg=default"
